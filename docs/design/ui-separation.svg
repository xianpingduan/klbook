    <g id="camera" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8H8L10 5H16L18 8H23V22H3Z"/><circle cx="13" cy="15" r="4"/></g>
    <g id="album" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="20" height="19" rx="3"/><circle cx="9" cy="10" r="2"/><path d="M4 20L10 15L14 18L19 12L23 18"/></g>
