<svg xmlns="http://www.w3.org/2000/svg" width="1520" height="980" viewBox="0 0 1520 980" role="img" aria-labelledby="title desc">
  <title id="title">错题集：管理端与学习端布局草案</title>
  <desc id="desc">左侧为具有侧栏、资料概览、待整理草稿和管理入口的家长后台；右侧为具有首页、收集、我的三个底部导航的手机学习端首页。页面内容为设计示例。</desc>
